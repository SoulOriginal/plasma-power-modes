PACKAGE_NAME="hp-wmi-charge"
PACKAGE_VERSION="1.0.0"
# The kernel's own hp-wmi with battery charge behaviour for HP board 8BAB.
# prepare-source.sh takes that kernel's upstream hp-wmi.c, checks it is the
# very file the kernel was built from, and patches it; when any of that
# fails, the build is skipped and the stock module stays.
BUILT_MODULE_NAME[0]="hp-wmi"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
PRE_BUILD="prepare-source.sh ${kernelver}"
MAKE[0]="make -C src KDIR=${kernel_source_dir}"
CLEAN="make -C src clean KDIR=${kernel_source_dir}"
# power_supply extensions, which charge_behaviour is added through, are 6.15+.
BUILD_EXCLUSIVE_KERNEL="^(6\.(1[5-9]|[2-9][0-9])|[7-9]|[1-9][0-9])\."
AUTOINSTALL="yes"
